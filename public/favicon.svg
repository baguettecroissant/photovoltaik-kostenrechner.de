<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Sun with rays -->
  <circle cx="22" cy="8" r="3.5" fill="url(#sun)"/>
  <g stroke="#FCD34D" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <line x1="22" y1="2.5" x2="22" y2="3.8"/>
    <line x1="22" y1="12.2" x2="22" y2="13.5"/>
    <line x1="16.5" y1="8" x2="17.8" y2="8"/>
    <line x1="26.2" y1="8" x2="27.5" y2="8"/>
    <line x1="18.1" y1="4.1" x2="19" y2="5"/>
    <line x1="25" y1="11" x2="25.9" y2="11.9"/>
    <line x1="25.9" y1="4.1" x2="25" y2="5"/>
    <line x1="19" y1="11" x2="18.1" y2="11.9"/>
  </g>
  <!-- Roof / Solar panel shape -->
  <path d="M4 19 L16 11 L28 19" fill="none" stroke="url(#roof)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Solar panel grid lines on roof -->
  <path d="M7.5 17.5 L16 12.5 L24.5 17.5" fill="none" stroke="#F59E0B" stroke-width="0.7" opacity="0.5"/>
  <!-- House body -->
  <rect x="8" y="19" width="16" height="9" rx="1" fill="white" opacity="0.15"/>
  <!-- Panel lines on house -->
  <line x1="12" y1="19" x2="12" y2="28" stroke="white" stroke-width="0.5" opacity="0.1"/>
  <line x1="16" y1="19" x2="16" y2="28" stroke="white" stroke-width="0.5" opacity="0.1"/>
  <line x1="20" y1="19" x2="20" y2="28" stroke="white" stroke-width="0.5" opacity="0.1"/>
  <line x1="8" y1="23" x2="24" y2="23" stroke="white" stroke-width="0.5" opacity="0.1"/>
</svg>
